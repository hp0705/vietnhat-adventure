<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="mitSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="70%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </radialGradient>
    <radialGradient id="mitBulb" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>
    <filter id="shadowMit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Big Thick Stem -->
  <path d="M 58,22 Q 54,10 46,6" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 52,16 Q 38,10 32,20 Q 44,22 52,16 Z" fill="#65a30d" stroke="#365314" stroke-width="1.5" />

  <g filter="url(#shadowMit)">
    <!-- Oblong Jackfruit Body with tiny spiky texture -->
    <ellipse cx="60" cy="68" rx="36" ry="44" fill="url(#mitSkin)" stroke="#365314" stroke-width="2.5" />

    <!-- Spiky dots texture (Gai mít chi chít) -->
    <g fill="#365314" opacity="0.6">
      <circle cx="40" cy="40" r="1.5" /><circle cx="50" cy="35" r="1.5" /><circle cx="62" cy="35" r="1.5" /><circle cx="74" cy="40" r="1.5" />
      <circle cx="34" cy="52" r="1.5" /><circle cx="44" cy="48" r="1.5" /><circle cx="54" cy="46" r="1.5" /><circle cx="68" cy="48" r="1.5" /><circle cx="80" cy="52" r="1.5" />
      <circle cx="30" cy="65" r="1.5" /><circle cx="40" cy="62" r="1.5" /><circle cx="32" cy="78" r="1.5" /><circle cx="40" cy="76" r="1.5" /><circle cx="82" cy="66" r="1.5" /><circle cx="86" cy="78" r="1.5" />
      <circle cx="38" cy="90" r="1.5" /><circle cx="48" cy="95" r="1.5" /><circle cx="60" cy="102" r="1.5" /><circle cx="72" cy="96" r="1.5" /><circle cx="80" cy="90" r="1.5" />
    </g>

    <!-- Cut Slice Revealing Golden Ripe Jackfruit Bulbs (Múi mít vàng ươm) -->
    <g transform="translate(10, 5)">
      <path d="M 45,55 C 45,45 75,45 78,60 C 80,78 75,90 55,92 C 45,92 42,75 45,55 Z" fill="#fef9c3" stroke="#eab308" stroke-width="2" />
      
      <!-- Golden Bulbs (Múi mít thơm lừng) -->
      <ellipse cx="56" cy="64" rx="7" ry="10" fill="url(#mitBulb)" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-15, 56, 64)" />
      <ellipse cx="68" cy="68" rx="6" ry="9" fill="url(#mitBulb)" stroke="#ca8a04" stroke-width="1.5" transform="rotate(20, 68, 68)" />
      <ellipse cx="58" cy="80" rx="7" ry="8" fill="url(#mitBulb)" stroke="#ca8a04" stroke-width="1.5" />
      <!-- Seeds peek (Hạt mít) -->
      <ellipse cx="56" cy="65" rx="2.5" ry="4" fill="#a16207" opacity="0.7" />
    </g>
  </g>
</svg>
