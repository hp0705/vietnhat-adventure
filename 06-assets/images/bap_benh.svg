<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="plankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadowSeesaw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#shadowSeesaw)">
    <!-- Ground Grass -->
    <path d="M 5,105 Q 60,102 115,105" stroke="#4ade80" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Center Fulcrum / Stand (Trụ tam giác giữa) -->
    <polygon points="60,65 46,105 74,105" fill="#f59e0b" stroke="#d97706" stroke-width="2.5" />
    <circle cx="60" cy="65" r="5" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Tilted Plank (Thanh bập bênh nghiêng nhẹ sinh động) -->
    <g transform="rotate(-15, 60, 65)">
      <!-- Main Board -->
      <rect x="8" y="60" width="104" height="10" rx="4" fill="url(#plankGrad)" stroke="#4338ca" stroke-width="2" />

      <!-- Left Seat & Handle (Chỗ ngồi bên trái - thấp) -->
      <rect x="12" y="54" width="18" height="6" rx="2" fill="#ef4444" />
      <path d="M 24,54 L 24,40 L 29,40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />

      <!-- Right Seat & Handle (Chỗ ngồi bên phải - cao) -->
      <rect x="90" y="54" width="18" height="6" rx="2" fill="#ef4444" />
      <path d="M 96,54 L 96,40 L 91,40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>
