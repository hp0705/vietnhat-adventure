<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ironBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ironBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadowIron" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#shadowIron)">
    <!-- Soleplate (Đế bàn là kim loại) -->
    <path d="M 18,92 L 95,92 C 105,92 112,87 114,83 C 112,79 105,78 95,78 L 18,78 Z" fill="url(#ironBase)" stroke="#64748b" stroke-width="2.5" />

    <!-- Main Body & Nose -->
    <path d="M 22,78 L 88,78 C 98,78 108,70 110,65 C 100,56 86,52 74,52 L 22,52 Z" fill="url(#ironBody)" stroke="#0369a1" stroke-width="2.5" />

    <!-- Water Tank / Accent Window -->
    <path d="M 35,72 L 78,72 C 84,72 88,68 85,63 C 78,60 60,60 35,60 Z" fill="#e0f2fe" opacity="0.8" />

    <!-- Temperature Dial Knob -->
    <circle cx="54" cy="66" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />

    <!-- Handle (Tay cầm) -->
    <path d="M 22,78 L 22,34 C 22,25 32,22 42,22 L 72,22 C 82,22 86,28 86,34 L 86,52 L 74,52 L 74,34 C 74,32 72,30 70,30 L 44,30 C 40,30 36,32 36,36 L 36,78 Z" fill="#0369a1" stroke="#075985" stroke-width="2.5" />

    <!-- Power Cord Swivel & Cord -->
    <circle cx="18" cy="74" r="5" fill="#475569" />
    <path d="M 14,74 C 6,70 8,55 2,52" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Steam Puffs (Tia hơi nước) -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="95" cy="100" r="4" />
    <circle cx="82" cy="104" r="5" />
    <circle cx="68" cy="102" r="3.5" />
  </g>
</svg>
