<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="duckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="duckChest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadowLeLe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.16" />
    </filter>
  </defs>

  <g filter="url(#shadowLeLe)">
    <!-- Water Ripple (Gợn sóng nước) -->
    <path d="M 10,95 Q 35,90 60,95 Q 85,100 110,95" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 25,103 Q 55,98 85,103" stroke="#0284c7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Duck Tail & Body -->
    <path d="M 22,65 C 10,55 12,75 22,82 C 35,90 75,90 88,80 C 95,72 90,60 80,60 C 65,60 55,50 45,55 C 32,60 26,62 22,65 Z" fill="url(#duckBody)" stroke="#451a03" stroke-width="2" />

    <!-- Wing with feather details -->
    <path d="M 38,65 C 28,68 25,78 35,82 C 50,86 70,82 75,72 C 68,68 55,62 38,65 Z" fill="#9a3412" stroke="#451a03" stroke-width="1.5" />
    <path d="M 32,74 Q 48,76 65,72" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Chest -->
    <path d="M 75,60 C 85,62 92,70 88,80 C 80,82 76,75 75,60 Z" fill="url(#duckChest)" />

    <!-- Slender Graceful Neck & Head -->
    <path d="M 75,62 C 78,50 78,35 70,25 C 65,18 78,14 85,20 C 92,26 90,45 84,62 Z" fill="#9a3412" stroke="#451a03" stroke-width="2" />

    <!-- Head & Crown -->
    <ellipse cx="80" cy="24" rx="12" ry="10" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    
    <!-- Eye -->
    <circle cx="83" cy="22" r="3" fill="#0f172a" />
    <circle cx="84" cy="21" r="1" fill="#ffffff" />

    <!-- Dark Bill (Mỏ le le) -->
    <path d="M 90,24 L 108,28 C 108,31 98,34 88,32 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>
