<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="starfruitBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="starSlice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Stem & Leaf -->
  <path d="M 52,24 Q 50,14 44,10" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 50,18 Q 36,12 34,22 Q 44,24 50,18 Z" fill="#65a30d" />

  <!-- Whole Starfruit Body -->
  <g filter="url(#shadow)">
    <!-- Main Oval Body -->
    <path d="M 52,22 C 82,30 92,68 80,95 C 68,112 40,110 32,92 C 20,68 30,28 52,22 Z" fill="url(#starfruitBody)" stroke="#ca8a04" stroke-width="2.5" />
    <!-- 5 Ridges (Khía khế) -->
    <path d="M 52,22 Q 48,60 32,92" stroke="#4d7c0f" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 52,22 Q 62,60 56,104" stroke="#a16207" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 52,22 Q 78,55 80,95" stroke="#4d7c0f" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 38,40 Q 22,65 34,84" stroke="#84cc16" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Cut Star Slice (Lát khế hình ngôi sao 5 cánh) -->
  <g transform="translate(68, 62) rotate(15)" filter="url(#shadow)">
    <!-- 5-pointed star slice with rounded lobes -->
    <path d="M 0,-24 
             C 4,-14 9,-10 18,-15 
             C 24,-19 28,-14 26,-7 
             C 23,2 26,8 34,13 
             C 40,18 36,24 29,24 
             C 19,25 15,31 16,40 
             C 16,48 10,48 4,44 
             C -4,40 -11,43 -14,51 
             C -17,58 -24,54 -24,47 
             C -23,37 -28,32 -37,30 
             C -44,29 -45,22 -39,18 
             C -31,13 -30,6 -35,-2 
             C -38,-9 -34,-14 -27,-12 
             C -18,-9 -12,-15 -14,-24 
             C -15,-31 -9,-33 -4,-30
             Z" 
          fill="url(#starSlice)" stroke="#ca8a04" stroke-width="3" />
    <!-- Inner Core & Seeds -->
    <circle cx="-2" cy="11" r="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" />
    <ellipse cx="-4" cy="8" rx="1.5" ry="3" fill="#713f12" transform="rotate(-30, -4, 8)" />
    <ellipse cx="2" cy="12" rx="1.5" ry="3" fill="#713f12" transform="rotate(45, 2, 12)" />
  </g>
</svg>
