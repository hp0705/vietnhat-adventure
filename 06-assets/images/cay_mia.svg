<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="canePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="40%" stop-color="#a21caf" />
      <stop offset="70%" stop-color="#86198f" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <linearGradient id="caneGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d7c0f" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>
    <filter id="shadowMia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#shadowMia)">
    <!-- Sugarcane Stalk 1 (Tím đỏ ngọt) -->
    <g transform="translate(18, 0)">
      <!-- Segment 1 -->
      <rect x="25" y="15" width="16" height="26" rx="3" fill="url(#canePurple)" stroke="#4a044e" stroke-width="1.5" />
      <ellipse cx="33" cy="41" rx="9" ry="2.5" fill="#f5d0fe" stroke="#701a75" stroke-width="1.5" />
      <!-- Segment 2 -->
      <rect x="25" y="41" width="16" height="28" rx="3" fill="url(#canePurple)" stroke="#4a044e" stroke-width="1.5" />
      <ellipse cx="33" cy="69" rx="9" ry="2.5" fill="#f5d0fe" stroke="#701a75" stroke-width="1.5" />
      <!-- Segment 3 -->
      <rect x="25" y="69" width="16" height="30" rx="3" fill="url(#canePurple)" stroke="#4a044e" stroke-width="1.5" />
      <ellipse cx="33" cy="99" rx="9" ry="2.5" fill="#f5d0fe" stroke="#701a75" stroke-width="1.5" />
      <!-- Bottom cut -->
      <rect x="25" y="99" width="16" height="15" rx="3" fill="url(#canePurple)" stroke="#4a044e" stroke-width="1.5" />
    </g>

    <!-- Sugarcane Stalk 2 (Xanh non phía sau) -->
    <g transform="translate(48, 10)">
      <rect x="18" y="10" width="14" height="26" rx="3" fill="url(#caneGreen)" stroke="#365314" stroke-width="1.5" />
      <ellipse cx="25" cy="36" rx="8" ry="2.2" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5" />
      <rect x="18" y="36" width="14" height="28" rx="3" fill="url(#caneGreen)" stroke="#365314" stroke-width="1.5" />
      <ellipse cx="25" cy="64" rx="8" ry="2.2" fill="#d9f99d" stroke="#4d7c0f" stroke-width="1.5" />
      <rect x="18" y="64" width="14" height="30" rx="3" fill="url(#caneGreen)" stroke="#365314" stroke-width="1.5" />
    </g>

    <!-- Fresh Sugarcane Leaves (Lá mía vuốt nhọn) -->
    <path d="M 50,20 C 35,-5 15,10 5,22 C 18,12 38,10 50,22 Z" fill="#65a30d" stroke="#3f6212" stroke-width="1" />
    <path d="M 52,18 C 65,-8 85,2 105,18 C 88,8 70,10 52,20 Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1" />
    <path d="M 48,15 C 48,-10 52,-15 54,0 Z" fill="#4ade80" />
  </g>
</svg>
